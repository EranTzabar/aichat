name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security problems, don't use this form: see [SECURITY.md](https://github.com/EranTzabar/aichat/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a chat
        2. Tag someone with @
        3. Press Enter
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Website
        - Server / API
        - MCP (AI agents)
        - Installing or starting (start.ps1, docker, migrations)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: From the browser console, the terminal or `.logs/`. Remove any API keys or passwords first.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Chrome 141, commit abc1234
