services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aichat
      POSTGRES_PASSWORD: aichat
      POSTGRES_DB: aichat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
